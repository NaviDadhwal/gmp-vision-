$kind: http-request
name: GET /projects (Cursor Feed)
url: "{{baseUrl}}/projects?limit=6"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Returns projects array', () => pm.expect(pm.response.json().data).to.be.an('array'));
order: 1000
