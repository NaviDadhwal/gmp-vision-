$kind: http-request
name: GET /filters (Public Ordered List)
url: "{{baseUrl}}/filters"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Returns filters array', () => pm.expect(pm.response.json().data).to.be.an('array'));
order: 1000
