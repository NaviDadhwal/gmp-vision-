$kind: http-request
name: GET /health (Liveness)
url: "{{rootUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Returns status ok', () => pm.expect(pm.response.json().status).to.eql('ok'));
order: 1000
