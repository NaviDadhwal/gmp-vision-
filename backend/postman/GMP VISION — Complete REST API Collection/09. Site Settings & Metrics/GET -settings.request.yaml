$kind: http-request
name: GET /settings
url: "{{baseUrl}}/settings"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Contains hero headline', () => pm.expect(pm.response.json().data).to.have.property('hero_headline'));
order: 1000
