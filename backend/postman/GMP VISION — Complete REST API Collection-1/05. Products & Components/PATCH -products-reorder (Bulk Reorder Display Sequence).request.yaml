$kind: http-request
name: PATCH /products/reorder (Bulk Reorder Display Sequence)
description: Bulk updates display sequence using MongoDB bulkWrite operation.
url: "{{baseUrl}}/products/reorder"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
body:
  type: json
  content: |-
    {
      "items": [
        {
          "id": "{{createdProductId}}",
          "order": 1
        }
      ]
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
