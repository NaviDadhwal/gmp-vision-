$kind: http-request
name: GET /leads/:id (Inquiry Detail)
description: Fetches full inquiry specification by MongoDB Lead ID.
url: "{{baseUrl}}/leads/{{createdLeadId}}"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: pm.test('Status is 200 or 404', () => pm.expect(pm.response.code).to.be.oneOf([200, 404]));
    language: text/javascript
order: 4000
