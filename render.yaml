services:
  - type: web
    name: gmp-vision-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        sync: false
      - key: EMAIL_FROM
        value: noreply@gmpvision.com
      - key: ADMIN_NOTIFICATION_EMAIL
        value: gmpvision3@gmail.com
      - key: SUPERADMIN_EMAIL
        value: admin@gmpvision.com
      - key: SUPERADMIN_PASSWORD
        sync: false
