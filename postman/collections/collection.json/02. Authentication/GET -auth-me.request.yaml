$kind: http-request
name: GET /auth/me
url: "{{baseUrl}}/auth/me"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Returns admin profile', () => pm.expect(pm.response.json().data.email).to.exist);
    language: text/javascript
order: 3000
